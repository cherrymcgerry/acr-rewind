name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Check the tag matches the crate version
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'acr_hook' }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build --release
        run: cargo build --workspace --release --locked

      - name: Package
        run: ./scripts/package.ps1 -SkipBuild -NoDevZip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ACR Rewind ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: |
            dist/ACR-Rewind-${{ env.VERSION }}.zip
            dist/SHA256SUMS.txt

[package]
name = "acr_shm"
description = "Reader for the Assetto Corsa Rally acpmf_* shared memory pages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "acr-shm-dump"
path = "src/bin/acr-shm-dump.rs"

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

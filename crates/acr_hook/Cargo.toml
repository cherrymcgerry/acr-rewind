[package]
name = "acr_hook"
description = "Injected DLL: tick detour, rewind controller driver, overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["overlay"]
# hudhook (imgui) DX12/DX11 overlay. Build with --no-default-features to drop it.
overlay = ["dep:hudhook"]

[dependencies]
rewind_core.workspace = true
acr_shm.workspace = true
acr_ue.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
retour.workspace = true
hudhook = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_Media_Multimedia",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_Com",
] }
